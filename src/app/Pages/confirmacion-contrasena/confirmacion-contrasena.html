<div class="confirm-container">
  <div class="confirm-card">
    <!-- Icono de candado -->
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-width="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-width="2"/>
      </svg>
    </div>

    <h3 class="confirm-title">Confirma tu contraseña</h3>
    <p class="confirm-subtitle">Por seguridad, necesitamos verificar tu identidad</p>

    <form [formGroup]="form" (ngSubmit)="confirmar()">
      <div class="form-group">
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2z" stroke-width="2"/>
            <path d="M9 11V7a3 3 0 0 1 6 0v4" stroke-width="2"/>
          </svg>
          <input
            type="password"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
            class="input-field"
          />
        </div>
      </div>

      <div class="error-message" *ngIf="mensajeError">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10" stroke-width="2"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke-width="2"/>
          <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2"/>
        </svg>
        {{ mensajeError }}
      </div>

      <div class="acciones">
        <button type="submit" class="btn-confirmar" data-testid="btn-confirmar">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <polyline points="20,6 9,17 4,12" stroke-width="2"/>
          </svg>
          Confirmar
        </button>
        <button type="button" class="btn-cancelar" (click)="cancelar()" data-testid="btn-cancelar">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="18" y1="6" x2="6" y2="18" stroke-width="2"/>
            <line x1="6" y1="6" x2="18" y2="18" stroke-width="2"/>
          </svg>
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
