<!-- Tarjeta Historia Clínica -->
<div class="card card-medica" style="margin-top: 30px;">
  <div class="card__content">
    <div class="card__text">
      <p class="card__title">Historia Clínica</p>

      <!-- Mostrar registros -->
      <div *ngIf="historiaClinica.length > 0; else sinRegistros" class="historial-wrapper">

        <div *ngFor="let row of historiaClinica" class="historial-item">
          <p class="historial-fecha">
            📅 {{ row.fecharegistro }}
          </p>
          <p class="historial-descripcion">
            {{ row.descripcion }}
          </p>
        </div>

      </div>

      <!-- Sin registros -->
      <ng-template #sinRegistros>
        <p class="card__description" style="margin-top: 15px;">
          Aún no hay registros de historia clínica.
        </p>
      </ng-template>

    </div>

    <!-- Footer si hay datos médicos -->
    <div class="card__footer" *ngIf="datosMedicos">
      <button mat-raised-button class="btn-accent" (click)="agregarHistoria()">
        Agregar / Ver Historia Clínica
      </button>
    </div>

    <!-- Si no hay datos médicos -->
    <div class="card__footer" *ngIf="!datosMedicos">
      <p class="card__description">
        Primero debes agregar tus datos médicos para poder registrar historia clínica.
      </p>
    </div>
  </div>
</div>
