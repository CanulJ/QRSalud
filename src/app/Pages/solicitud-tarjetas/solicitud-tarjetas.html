<div class="contenedor">
  <h2>📋 Solicitudes de Tarjetas</h2>

  <!-- Spinner de carga -->
  <div *ngIf="cargando" class="spinner-container">
    <mat-spinner></mat-spinner>
  </div>

  <!-- Mensaje de error -->
  <div *ngIf="error" class="error">{{ error }}</div>

  <!-- Contenedor scroll -->
  <div class="tabla-scroll" *ngIf="!cargando && solicitudes.length > 0">
    <table mat-table [dataSource]="solicitudes" class="mat-elevation-z8">
      
      <!-- ID Solicitud -->
      <ng-container matColumnDef="idSolicitud">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let s" data-label="ID">{{ s.idSolicitud }}</td>
      </ng-container>

      <!-- Usuario -->
      <ng-container matColumnDef="userId">
        <th mat-header-cell *matHeaderCellDef>ID Usuario</th>
        <td mat-cell *matCellDef="let s" data-label="Usuario">{{ s.userId }}</td>
      </ng-container>

      <!-- Estado -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let s" data-label="Estado">
          <span
            [ngClass]="{
              'estado-pendiente': s.estado === 'pendiente',
              'estado-aprobada': s.estado === 'aprobada',
              'estado-rechazada': s.estado === 'rechazada'
            }"
          >
            {{ s.estado | titlecase }}
          </span>
        </td>
      </ng-container>

      <!-- Fecha -->
      <ng-container matColumnDef="fecha_Solicitud">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let s" data-label="Fecha">{{ s.fecha_Solicitud | date: 'short' }}</td>
      </ng-container>

      <!-- Token -->
      <ng-container matColumnDef="token">
        <th mat-header-cell *matHeaderCellDef>Token</th>
        <td mat-cell *matCellDef="let s" data-label="Token">{{ s.token || '-' }}</td>
      </ng-container>

      <!-- QR -->
      <ng-container matColumnDef="qr">
  <th mat-header-cell *matHeaderCellDef>QR</th>
  <td mat-cell *matCellDef="let s" data-label="QR">
    <img *ngIf="s.qrDataURL" [src]="s.qrDataURL" alt="QR Code" width="80" height="80" />
  </td>
</ng-container>


      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let s" data-label="Acciones">
          <button
            mat-raised-button
            color="primary"
            (click)="aprobarSolicitud(s)"
            [disabled]="s.estado === 'aprobada'">
            ✔️
          </button>

          <button
            mat-raised-button
            color="warn"
            (click)="rechazarSolicitud(s)"
            [disabled]="s.estado === 'rechazada'">
            ❌
          </button>
        </td>
      </ng-container>

      <!-- Filas -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>
  </div>

  <!-- Mensaje si no hay solicitudes -->
  <p *ngIf="!cargando && solicitudes.length === 0" class="sin-datos">
    No hay solicitudes registradas.
  </p>
</div>
