<div class="denegado-container">
  <div class="lock-icon">
    <svg width="50" height="50" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#fef2f2;stop-opacity:1" />
        </linearGradient>
      </defs>
      <!-- Candado principal -->
      <rect x="30" y="45" width="40" height="35" rx="4" fill="url(#lockGradient)" stroke="white" stroke-width="2" />
      <!-- Arco del candado -->
      <path d="M40 45V35C40 29 44 25 50 25C56 25 60 29 60 35V45" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" />
      <!-- Punto de cerradura -->
      <circle cx="50" cy="60" r="3" fill="white" />
      <rect x="49" y="63" width="2" height="8" rx="1" fill="white" />
    </svg>
  </div>

  <h2>Acceso Denegado</h2>
  <p>Debes iniciar sesión para continuar.</p>
  <button (click)="irLogin()">Ir al inicio de sesión</button>
</div>
