<!-- seguro-medico-for.html -->
<div class="card">
  <div class="form-container">
    <h3>Agregar / Editar Seguro Médico</h3>

    <form>
      <div class="input-container">
        <label for="tiposeguro">Tipo de Seguro:</label>
        <input id="tiposeguro" class="input" [(ngModel)]="seguro.tiposeguro" name="tiposeguro" placeholder="Público / Privado" type="text" />
        <div class="underline"></div>
      </div>

      <div class="input-container">
        <label for="institucion">Institución:</label>
        <input id="institucion" class="input" [(ngModel)]="seguro.institucion" name="institucion" placeholder="Ej. IMSS, ISSSTE, AXA..." type="text" />
        <div class="underline"></div>
      </div>

      <div class="input-container">
        <label for="numeropoliza">Número de Póliza:</label>
        <input id="numeropoliza" class="input" [(ngModel)]="seguro.numeropoliza" name="numeropoliza" placeholder="Número de póliza" type="text" />
        <div class="underline"></div>
      </div>

      <div class="input-container">
        <label for="vigencia">Vigencia:</label>
        <input id="vigencia" class="input" [(ngModel)]="seguro.vigencia" name="vigencia" type="date" />
        <div class="underline"></div>
      </div>

      <div class="acciones card__footer">
        <button type="button" mat-flat-button color="primary" (click)="guardar()">Guardar</button>
        <button type="button" mat-button color="warn" (click)="cerrar()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
